name: Bootstrap debug keystore

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # A committed keystore is tag-agnostic: every future tag build reads
      # the same file from git, unlike a GitHub Actions cache entry, which
      # is scoped per-ref and isn't shared across different tags (that's
      # why v1.0.0 and v1.0.1 ended up signed with different debug keys).
      - name: Generate keystore if missing
        run: |
          if [ ! -f keystore/debug.keystore ]; then
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/debug.keystore \
              -storepass burrow2026 -keypass burrow2026 \
              -alias burrowdebug -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Burrow, OU=Dev, O=minhdua-coder"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore/debug.keystore
            git commit -m "Add stable debug signing keystore [skip ci]"
            git push
          else
            echo "keystore/debug.keystore already exists, nothing to do"
          fi
